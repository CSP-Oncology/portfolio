<!DOCTYPE html>
<html lang="en" data-theme-engine="sass">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="{{ '/assets/images/sesh/favicon.png' | relative_url }}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title and page.title != "Home" %}{{ page.title }} | {% endif %}Sesh</title>
  <meta name="description" content="{{ page.intro | default: 'Precision cancer care and liquid biopsy, explained.' }}">
  <!-- Preferences (Settings page), as on Open Coding Society: assets/js/user-preferences.js applies
       the saved theme and language on every page. data-theme-engine="sass" above means it only sets
       CSS variables; _sass/sesh/_theme.scss styles the site from them. -->
  <script>
    window.SITE_THEME_DEFAULT = {{ site.data.sesh_theme | jsonify }};
    // Paint the saved colors before the page shows, so it doesn't flash the default look first
    (function () {
      try {
        if (localStorage.getItem('preferencesReset') === 'true') return;
        var p = JSON.parse(localStorage.getItem('sitePreferences') || 'null');
        if (!p || !(p.bg || p.text)) return;
        var root = document.documentElement, d = window.SITE_THEME_DEFAULT;
        var set = function (name, value) { if (value) root.style.setProperty(name, value); };
        set('--pref-bg-color', p.bg || d.bg);
        set('--pref-text-color', p.text || d.text);
        set('--pref-accent-color', p.accent || d.accent);
        set('--pref-selection-color', p.selectionColor || p.accent || d.accent);
        set('--pref-font-family', p.font || d.font);
        set('--pref-font-size', (p.size || d.size) + 'px');
        root.classList.add('user-theme-active');
        // Dark background? (same test as user-preferences.js ColorUtils.isLightColor)
        var bg = (p.bg || d.bg).replace('#', '');
        var r = parseInt(bg.substr(0, 2), 16), g = parseInt(bg.substr(2, 2), 16), b = parseInt(bg.substr(4, 2), 16);
        if ((0.299 * r + 0.587 * g + 0.114 * b) / 255 <= 0.5) root.classList.add('pref-dark');
        if (p.language) root.setAttribute('lang', p.language);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&family=Inter:wght@400;600&family=Lato:wght@400;700&family=Montserrat:wght@400;600&family=Open+Sans:wght@400;600&family=Roboto:wght@400;500&family=Source+Code+Pro:wght@400;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/sesh.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {% include sesh/header.html %}

  <main id="main">
    {% if page.heading %}
    <section class="page-head">
      <div class="wrap">
        {% if page.parent %}<nav class="crumbs" aria-label="Breadcrumb"><a href="{{ page.parent_url | relative_url }}">{{ page.parent }}</a> › {{ page.title }}</nav>{% endif %}
        <h1>{{ page.heading }}</h1>
        {% if page.intro %}<p>{{ page.intro }}</p>{% endif %}
      </div>
    </section>
    {% endif %}
    {{ content }}
  </main>

  {% include sesh/footer.html %}

  <script src="{{ '/assets/js/user-preferences.js' | relative_url }}"></script>
  <script type="module" src="{{ '/assets/js/sesh/main.js' | relative_url }}"></script>
</body>
</html>
