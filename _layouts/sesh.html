<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title and page.title != "Home" %}{{ page.title }} | {% endif %}Oncology Sesh</title>
  <meta name="description" content="{{ page.intro | default: 'A student capstone about precision oncology and liquid biopsy.' }}">
  <style>
    .goog-te-banner-frame,
    iframe.goog-te-banner-frame,
    .goog-te-balloon-frame,
    #goog-gt-tt,
    .goog-te-gadget,
    #google_translate_element,
    body > .skiptranslate,
    .skiptranslate iframe { display: none !important; visibility: hidden !important; height: 0 !important; }
    html, body, html.translated-ltr, html.translated-rtl { top: 0 !important; position: static !important; margin-top: 0 !important; }
  </style>
  <!-- Apply the visitor's Settings (theme, text size, font, spacing, motion) before the page paints.
       They're saved in this browser and, when logged in, to the account (see assets/js/sesh/settings.js). -->
  <script>
    (function () {
      var prefs = {};
      try { prefs = JSON.parse(localStorage.getItem('sesh-settings') || '{}') || {}; } catch (e) {}
      var root = document.documentElement;
      root.setAttribute('data-theme', prefs.theme || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
      ['size', 'font', 'spacing', 'motion'].forEach(function (key) { if (prefs[key]) root.setAttribute('data-' + key, prefs[key]); });
      if (prefs.language === 'es') {
        root.setAttribute('lang', 'es');
        root.setAttribute('data-translate-lang', 'es');
        document.cookie = 'googtrans=/en/es; path=/';
      } else {
        root.setAttribute('lang', 'en');
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/sesh.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {% include sesh/header.html %}

  <main id="main">
    {% if page.heading %}
    <section class="page-head">
      <div class="wrap">
        {% if page.parent %}<nav class="crumbs" aria-label="Breadcrumb"><a href="{{ page.parent_url | relative_url }}">{{ page.parent }}</a> › {{ page.title }}</nav>{% endif %}
        <h1>{{ page.heading }}</h1>
        {% if page.intro %}<p>{{ page.intro }}</p>{% endif %}
      </div>
    </section>
    {% endif %}
    {{ content }}
  </main>

  {% include sesh/footer.html %}

  <div id="google_translate_element" hidden></div>
  <script>
    window.googleTranslateElementInit = function () {
      new google.translate.TranslateElement({
        pageLanguage: 'en',
        includedLanguages: 'en,es',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
        autoDisplay: false
      }, 'google_translate_element');
    };
    var script = document.createElement('script');
    script.id = 'google-translate-script';
    script.src = '//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
    document.body.appendChild(script);
  </script>
  <script type="module" src="{{ '/assets/js/sesh/main.js' | relative_url }}"></script>
</body>
</html>
